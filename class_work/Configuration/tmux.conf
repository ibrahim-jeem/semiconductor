# 1. SETUP & VARIABLES
# ==========================================
# We use a clean OSC52 variable without a trailing semicolon
set -g @osc52_copy "base64 | tr -d '\n' | awk '{printf \"\033]52;c;%s\007\", \$0}'"
 
set -g mouse on
setw -g mode-keys vi
set -g buffer-limit 1
set -s set-clipboard on
set -s escape-time 0
 
# ==========================================
# 2. MOUSE BEHAVIOR
# ==========================================
unbind -n MouseDrag1Pane
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDrag1Pane send-keys -X begin-selection
 
# ==========================================
# 3. POWER COPY BINDINGS
# ==========================================
 
# Standard 'y' yank
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@osc52_copy} > #{client_tty}"
 
# 'Y' to copy WHOLE LINE
bind -T copy-mode-vi Y send-keys -X start-of-line \; \
    send-keys -X begin-selection \; \
    send-keys -X end-of-line \; \
    send-keys -X copy-pipe-and-cancel "#{@osc52_copy} > #{client_tty}"
 
# 'G' - THE ABSOLUTE FIX
# This uses 'copy-selection' with a jump, ensuring the buffer follows
bind -T copy-mode-vi G send-keys -X begin-selection \; \
    send-keys -X history-bottom \; \
    send-keys -X end-of-line \; \
    run-shell "tmux send-keys -X copy-pipe-and-cancel \"#{@osc52_copy} > #{client_tty}\""
 
# 'L' for N lines
bind -T copy-mode-vi L command-prompt -p "Lines down to copy:" \
    "send-keys -X select-line; \
     send-keys -X -N %% cursor-down; \
     send-keys -X copy-pipe-and-cancel '#{@osc52_copy} > #{client_tty}'"